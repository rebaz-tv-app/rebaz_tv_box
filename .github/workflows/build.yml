name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # ڕێگەت پێدەدات بە دەستی لە ناو گیتھەب دوگمەی ڕاکردن (Run) دابگریت

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. کۆدەکانی پرۆژەکە لە گیتھەب وەردەگرێت
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. ئامادەکردنی جاڤا 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. دابەزاندن و ڕێکخستنی Gradle وەشانی 9.3.1 (وەشانی دروستی پرۆژەکە)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # 4. دروستکردنی فایلی APK بە فەرمانی Gradle
      - name: Build with Gradle
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      # 5. بارکردنی فایلی APK تا ڕاستەوخۆ بتوانیت لە بەشی Artifacts دایگریت
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RebazTV-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
